# 玩法 25：综合信息图（lowlighter/metrics）
name: Metrics
on:
  schedule: [{cron: '0 0 * * *'}]
  workflow_dispatch:
jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alsunmengy
          template: classic
          config_display: large
          plugin_isocalendar: yes
          plugin_languages: yes
          output_action: commit
